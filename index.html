r:#16834a}.opt.bad{background:#fff0ee;border-color:#c0392b}.opt:disabled{opacity:1}.feedback{margin-top:13px;padding:13px;background:#f3f7fb;border-radius:10px;line-height:1.6}.good{color:#16834a;font-weight:bold}.badtext{color:#c0392b;font-weight:bold}.translation{background:#fff8dc;border-left:4px solid #e4bf37;padding:11px;margin-top:9px;border-radius:6px}.entry{background:#fff3b8;padding:13px;border-radius:10px;margin:12px 0}.entry label{display:block;font-weight:bold;margin-bottom:8px}.entry input,.entry textarea{display:block;width:100%;max-width:100%;padding:13px;border:2px solid #dfbd45;border-radius:9px;background:#fff1a8;font-size:17px;line-height:1.5}.entry textarea{min-height:110px;resize:vertical}.writingline{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:18px;line-height:1.7}.writingline .yellow{flex:1 1 100%;width:100%;min-width:0;min-height:105px}.writingline span{white-space:pre-wrap}.hintbox{display:none;background:#f3edff;border-left:4px solid #7955b5;padding:11px;margin-top:10px;border-radius:7px}.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:15px}.nav select{padding:10px;border:1px solid #ccd8e5;border-radius:8px}.score{font-weight:bold;color:#17365d}.questionno{font-size:13px;color:#64748b;font-weight:bold;margin-bottom:8px}@media(max-width:760px){.layout{grid-template-columns:1fr}.reading,.questions{max-height:48vh;min-height:200px}.panel{padding:13px}.qtext{font-size:17px}}

<script>
const sections = [{"id": "pron", "title": "PART A – Pronunciation", "type": "mc", "items": [{"q": "Choose the word whose underlined part is different.", "opts": ["A. c<u>oo</u>k", "B. l<u>oo</u>k", "C. f<u>oo</u>d", "D. f<u>oo</u>t"], "a": 2, "why": "Theo phần gạch chân và đáp án tô vàng trong tài liệu, chọn C. “Food”.", "vi": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại."}, {"q": "Choose the word whose underlined part is different.", "opts": ["A. b<u>e</u>come", "B. b<u>e</u>have", "C. d<u>e</u>cide", "D. op<u>e</u>n"], "a": 3, "why": "Đáp án được tô vàng là D. “Open”.", "vi": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại."}, {"q": "Choose the word whose underlined part is different.", "opts": ["A. vill<u>a</u>ge", "B. <u>a</u>partment", "C. hospit<u>a</u>ble", "D. b<u>a</u>nana"], "a": 0, "why": "Đáp án được tô vàng là A. “Village”.", "vi": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại."}, {"q": "Choose the word whose underlined part is different.", "opts": ["A. leis<u>ure</u>", "B. cult<u>ure</u>", "C. nat<u>ure</u>", "D. s<u>ure</u>"], "a": 3, "why": "Đáp án được tô vàng là D. “Sure”.", "vi": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại."}, {"q": "Choose the word whose underlined part is different.", "opts": ["A. gr<u>o</u>up", "B. sch<u>o</u>ol", "C. m<u>o</u>ve", "D. w<u>o</u>uld"], "a": 3, "why": "Đáp án được tô vàng là D. “Would”.", "vi": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại."}]}, {"id": "mc", "title": "PART A – Multiple Choice", "type": "mc", "items": [{"q": "Jenny dislikes ______ the Net in the evening.", "opts": ["A. to surf", "B. surf", "C. surfed", "D. surfing"], "a": 3, "why": "Sau “dislike” thường dùng V-ing. “Dislikes surfing the Net” = không thích lướt mạng.", "vi": "Jenny không thích lướt Internet vào buổi tối."}, {"q": "My children are very ______ of going to the zoo.", "opts": ["A. excited", "B. interested", "C. keen", "D. fond"], "a": 3, "why": "Cụm cố định: “be fond of + V-ing” = rất thích làm gì.", "vi": "Các con tôi rất thích đi sở thú."}, {"q": "I usually ______ my friends whenever I need your help.", "opts": ["A. message", "B. hit", "C. keep", "D. joke"], "a": 0, "why": "“Message somebody” nghĩa là nhắn tin cho ai.", "vi": "Tôi thường nhắn tin cho bạn bè bất cứ khi nào tôi cần sự giúp đỡ của bạn."}, {"q": "Mai’s foreign friends fancy ______ museums when they are in Vietnam.", "opts": ["A. visits", "B. to visit", "C. to visiting", "D. visiting"], "a": 3, "why": "“Fancy” được theo sau bởi V-ing khi diễn tả thích làm gì.", "vi": "Những người bạn nước ngoài của Mai thích tham quan các bảo tàng khi họ ở Việt Nam."}, {"q": "Minh ______ to play football, and so does his brother.", "opts": ["A. likes", "B. enjoys", "C. fancies", "D. detest"], "a": 0, "why": "Cấu trúc “like + to V” đúng với phần “to play”. Chủ ngữ Minh số ít nên dùng “likes”.", "vi": "Minh thích chơi bóng đá, và anh/em trai của cậu ấy cũng vậy."}, {"q": "Farmers in Ly Nhon are ______ in the yard after they have harvested all the fields.", "opts": ["A. drying rice", "B. washing clothes", "C. dragon-snake", "D. milk cows"], "a": 0, "why": "Đáp án theo phần tô vàng: “drying rice” – phơi lúa.", "vi": "Nông dân ở Lý Nhơn đang phơi lúa ngoài sân sau khi họ thu hoạch tất cả các cánh đồng."}, {"q": "I used to go ______ buffaloes when I was small.", "opts": ["A. herding", "B. swimming", "C. hiking", "D. cooking"], "a": 0, "why": "Cụm từ “go herding buffaloes” nghĩa là đi chăn trâu.", "vi": "Khi còn nhỏ, tôi thường đi chăn trâu."}, {"q": "My sister dances ______ than me.", "opts": ["A. gooder", "B. weller", "C. better", "D. more good"], "a": 2, "why": "“Well” là trạng từ bất quy tắc; dạng so sánh hơn là “better”.", "vi": "Chị/em gái tôi nhảy giỏi hơn tôi."}, {"q": "The farmers started harvesting their crops ______ than they expected.", "opts": ["A. earlier", "B. more earlier", "C. early", "D. earlier than"], "a": 0, "why": "“Early” có dạng so sánh hơn là “earlier”. Không dùng “more earlier”.", "vi": "Những người nông dân bắt đầu thu hoạch mùa màng sớm hơn họ dự kiến."}, {"q": "Nick can jump ______ than Tom.", "opts": ["A. more high", "B. higher than", "C. higher", "D. more higher"], "a": 2, "why": "“High” là trạng từ ngắn; dạng so sánh hơn là “higher”. Từ “than” đã có sau chỗ trống.", "vi": "Nick có thể nhảy cao hơn Tom."}, {"q": "Minh is not fond of ______ puzzles because he thinks it takes a lot of time.", "opts": ["A. making", "B. doing", "C. collecting", "D. building"], "a": 1, "why": "Cụm từ tự nhiên là “do puzzles” = giải câu đố.", "vi": "Minh không thích giải câu đố vì cậu ấy nghĩ việc đó tốn nhiều thời gian."}, {"q": "After school, we sometimes post a few questions on the ______ for discussion.", "opts": ["A. bully", "B. forum", "C. competition", "D. notification"], "a": 1, "why": "“Forum” là diễn đàn trực tuyến, nơi mọi người đăng câu hỏi và thảo luận.", "vi": "Sau giờ học, đôi khi chúng tôi đăng một vài câu hỏi lên diễn đàn để thảo luận."}, {"q": "Ally tries to overcome the ______ from her family by studying hard to get the best results.", "opts": ["A. media", "B. teamwork", "C. website", "D. pressure"], "a": 3, "why": "“Pressure” nghĩa là áp lực; cụm “pressure from her family” là áp lực từ gia đình.", "vi": "Ally cố gắng vượt qua áp lực từ gia đình bằng cách học tập chăm chỉ để đạt kết quả tốt nhất."}, {"q": "Would you like to drink milk tea ______ coffee?", "opts": ["A. or", "B. otherwise", "C. so", "D. therefore"], "a": 0, "why": "“Or” dùng để đưa ra lựa chọn giữa hai thứ.", "vi": "Bạn muốn uống trà sữa hay cà phê?"}, {"q": "I am learning English ______ I want to get a good job after school.", "opts": ["A. but", "B. because", "C. so", "D. therefore"], "a": 1, "why": "“Because” nối mệnh đề chỉ lý do.", "vi": "Tôi đang học tiếng Anh vì tôi muốn có một công việc tốt sau khi ra trường."}]}, {"id": "comparatives", "title": "PART A – Comparative Adverbs", "type": "text", "items": [{"q": "She speaks __________ than her sister. (fluently)", "a": "more fluently", "why": "Trạng từ dài “fluently” dùng “more + adverb” để tạo so sánh hơn.", "vi": "Cô ấy nói lưu loát hơn chị/em gái mình."}, {"q": "You should drive __________ in the rain. (carefully)", "a": "more carefully", "why": "Trạng từ dài “carefully” → more carefully.", "vi": "Bạn nên lái xe cẩn thận hơn khi trời mưa."}, {"q": "My brother runs __________ than me. (fast)", "a": "faster", "why": "“Fast” là trạng từ ngắn; dạng so sánh hơn thêm -er: faster.", "vi": "Anh/em trai tôi chạy nhanh hơn tôi."}, {"q": "John dances more __________ than anyone in his class. (well)", "a": "better", "why": "“Well” là trạng từ bất quy tắc; dạng so sánh hơn là “better”. Đáp án giữ đúng phần từ cần điền theo tài liệu.", "vi": "John nhảy giỏi hơn bất kỳ ai trong lớp."}, {"q": "He answered the questions __________ than before. (politely)", "a": "more politely", "why": "Trạng từ dài “politely” → more politely.", "vi": "Anh ấy trả lời các câu hỏi lịch sự hơn trước."}, {"q": "They performed __________ than last time. (well)", "a": "better", "why": "“Well” có dạng so sánh hơn bất quy tắc là “better”.", "vi": "Họ biểu diễn tốt hơn lần trước."}, {"q": "Tom jumps __________ than his classmates. (high)", "a": "higher", "why": "“High” là trạng từ ngắn; dạng so sánh hơn là “higher”.", "vi": "Tom nhảy cao hơn các bạn cùng lớp."}, {"q": "I arrived __________ than I usually do. (late)", "a": "later", "why": "“Late” có dạng so sánh hơn là “later”.", "vi": "Tôi đến muộn hơn so với thường lệ."}, {"q": "Today it is raining __________ than it was yesterday. (heavily)", "a": "more heavily", "why": "Trạng từ dài “heavily” → more heavily.", "vi": "Hôm nay trời mưa nặng hạt hơn hôm qua."}, {"q": "After finishing the exam, he went to bed __________ than ever before. (early)", "a": "earlier", "why": "“Early” đổi y thành i rồi thêm -er: earlier.", "vi": "Sau khi hoàn thành bài thi, anh ấy đi ngủ sớm hơn bao giờ hết."}]}, {"id": "readgap", "title": "PART B – Reading: Stress (Gap Filling)", "type": "readingmc", "passage": "Every teenage feels (31) ______ at times. There are different kinds of troubles, such as academic pressures, family issues and difficulties with peers. We must say that they are the main things that teens have to (32) ______ with on a daily basis. None of us can avoid stress completely, but (33) ______ give us some advice about things we can do to reduce our stress levels. Firstly, it's important to exercise regularly, and avoid eating (34) ______ food. It is also important to take time out every day to do something that makes you happy. It may be listening to your favorite music, talking to a friend, or (35) ______ time with a pet. It is always helpful to talk about your problems with others whether that's a friend, your parents or a teacher. As the saying goes, “A problem shared, is a problem halved!”", "translation": "Mọi thanh thiếu niên đôi khi đều cảm thấy căng thẳng. Có nhiều loại rắc rối khác nhau, chẳng hạn như áp lực học tập, vấn đề gia đình và khó khăn với bạn bè. Chúng ta phải nói rằng đó là những vấn đề chính mà thanh thiếu niên phải đối mặt hằng ngày. Không ai trong chúng ta có thể hoàn toàn tránh được căng thẳng, nhưng các nhà tâm lý học đưa ra cho chúng ta một số lời khuyên về những việc có thể làm để giảm mức độ căng thẳng. Trước hết, điều quan trọng là tập thể dục thường xuyên và tránh ăn thực phẩm không lành mạnh. Việc dành thời gian mỗi ngày để làm điều khiến bạn vui cũng rất quan trọng. Đó có thể là nghe nhạc yêu thích, trò chuyện với bạn bè hoặc dành thời gian với thú cưng. Trò chuyện về vấn đề của mình với người khác, dù là bạn bè, cha mẹ hay giáo viên, luôn hữu ích. Như câu tục ngữ: “Một vấn đề được chia sẻ sẽ vơi đi một nửa!”", "items": [{"q": "31. Every teenage feels ______ at times.", "opts": ["A. stress", "B. stressing", "C. stressed", "D. stressful"], "a": 2, "why": "“Feel” là động từ nối, theo sau là tính từ. “Stressed” diễn tả cảm giác căng thẳng.", "vi": "Mọi thanh thiếu niên đôi khi đều cảm thấy căng thẳng."}, {"q": "32. They are the main things that teens have to ______ with on a daily basis.", "opts": ["A. cope", "B. think", "C. talk", "D. keep"], "a": 0, "why": "Cụm cố định “cope with” có nghĩa là đối phó với.", "vi": "Đó là những vấn đề chính mà thanh thiếu niên phải đối mặt hằng ngày."}, {"q": "33. None of us can avoid stress completely, but ______ give us some advice.", "opts": ["A. psychology", "B. psychologies", "C. psychologist", "D. psychologists"], "a": 3, "why": "Cần danh từ chỉ người ở dạng số nhiều làm chủ ngữ: “psychologists” (các nhà tâm lý học).", "vi": "Không ai có thể hoàn toàn tránh được căng thẳng, nhưng các nhà tâm lý học đưa ra cho chúng ta một số lời khuyên."}, {"q": "34. It is important to exercise regularly, and avoid eating ______ food.", "opts": ["A. healthy", "B. health", "C. unhealthy", "D. unhealth"], "a": 2, "why": "“Unhealthy” là tính từ có nghĩa là không lành mạnh, bổ nghĩa cho “food”.", "vi": "Điều quan trọng là tập thể dục thường xuyên và tránh ăn thực phẩm không lành mạnh."}, {"q": "35. It may be listening to your favorite music, talking to a friend, or ______ time with a pet.", "opts": ["A. to spending", "B. spending", "C. spend", "D. to spend"], "a": 1, "why": "Các hoạt động được liệt kê song song sau “or” đều dùng dạng V-ing: listening, talking, spending.", "vi": "Đó có thể là nghe nhạc yêu thích, trò chuyện với bạn bè hoặc dành thời gian với thú cưng."}]}, {"id": "readtf", "title": "PART B – Reading: Country Life (True / False)", "type": "readingtf", "passage": "City life has its advantages and disadvantages and so does country life; however, there seems to be an increased interest in the country, especially among young families. If you are thinking about moving to the country as well but are not sure if it is a good idea, it may help to look at the benefits of country life. In the country, you are woken up by the singing of the birds rather by the noise from the traffic. Homes in the countryside are surrounded by nature which has a soothing effect on both the mind and the body. Due to virtual absence of cars and factories, you will not be breathing any potentially toxic fumes in the country. Clean air is one of the main advantages of country life over city dwelling. In the country, everyone knows everyone and people actually say ‘hello’. Communities in the country are much smaller but they are more connected and open. People in the country are really friendlier and are prepared to help without asking anything in return.", "translation": "Cuộc sống thành phố có những ưu điểm và nhược điểm, cuộc sống nông thôn cũng vậy; tuy nhiên, dường như ngày càng có nhiều người quan tâm đến vùng nông thôn, đặc biệt là các gia đình trẻ. Nếu bạn cũng đang nghĩ đến việc chuyển về nông thôn nhưng chưa chắc đó có phải ý hay không, việc tìm hiểu những lợi ích của cuộc sống nông thôn có thể giúp ích. Ở nông thôn, bạn thức dậy bởi tiếng chim hót thay vì tiếng ồn giao thông. Nhà cửa ở vùng quê được bao quanh bởi thiên nhiên, điều này có tác động xoa dịu cả tâm trí lẫn cơ thể. Do hầu như không có ô tô và nhà máy, bạn sẽ không hít phải những khí thải có khả năng độc hại ở nông thôn. Không khí trong lành là một trong những lợi thế chính của cuộc sống nông thôn so với cuộc sống thành thị. Ở nông thôn, mọi người đều biết nhau và thực sự chào hỏi nhau. Các cộng đồng ở nông thôn nhỏ hơn nhiều nhưng gắn kết và cởi mở hơn. Người dân nông thôn thân thiện hơn và sẵn sàng giúp đỡ mà không đòi hỏi bất cứ điều gì đáp lại.", "items": [{"q": "36. More and more young families like living in the countryside.", "a": "T", "why": "Bài đọc nói có sự quan tâm ngày càng tăng đến vùng nông thôn, đặc biệt là trong các gia đình trẻ.", "vi": "Ngày càng có nhiều gia đình trẻ thích sống ở vùng nông thôn."}, {"q": "37. Communities in the city are much smaller than those in the countryside.", "a": "F", "why": "Bài đọc nói các cộng đồng ở nông thôn nhỏ hơn nhiều; không nói cộng đồng thành phố nhỏ hơn.", "vi": "Các cộng đồng ở thành phố nhỏ hơn nhiều so với các cộng đồng ở nông thôn."}, {"q": "38. In the countryside, birds’ singing is very noisy.", "a": "F", "why": "Bài đọc đối chiếu tiếng chim hót với tiếng ồn giao thông; không nói tiếng chim hót rất ồn.", "vi": "Ở nông thôn, tiếng chim hót rất ồn ào."}, {"q": "39. There are not many cars and factories in the countryside.", "a": "T", "why": "Bài đọc nêu “virtual absence of cars and factories” – hầu như không có ô tô và nhà máy.", "vi": "Ở nông thôn không có nhiều ô tô và nhà máy."}, {"q": "40. In the countryside, you shouldn’t pay money when being helped.", "a": "T", "why": "Bài đọc nói người dân sẵn sàng giúp đỡ mà không đòi hỏi bất cứ điều gì đáp lại.", "vi": "Ở nông thôn, bạn không phải trả tiền khi được giúp đỡ."}]}, {"id": "readmc", "title": "PART B – Reading: Social Networking", "type": "readingmc", "passage": "One of the most obvious negative aspects of social networking is losing face-to-face contact with other people. Teens are sitting around with their phone in their hands all day long, tapping messages onto screens instead of communicating with real people. Many teenagers feel more comfortable with virtual friends than with real ones. The majority think that it is easier to chat on the Internet because they lack communication skills. It is also true that parents often have no knowledge about what their kids do with their phones or computer. Crosby says that, “While kids are plugged in to social media, only about 40% of parents are involved themselves.” And because parents don't know the full picture, they also don't know how to deal with a teenager's potential overuse of social media and might not even be aware that a problem exists. Therefore, social networking can be much more immediately engaging with the teenager's life than parents are, and this fact makes virtual communication feel more “real” than face-to-face communication.", "translation": "Một trong những mặt tiêu cực rõ ràng nhất của mạng xã hội là làm mất sự tiếp xúc trực tiếp với người khác. Thanh thiếu niên ngồi cả ngày với điện thoại trên tay, nhắn tin trên màn hình thay vì giao tiếp với người thật. Nhiều thanh thiếu niên cảm thấy thoải mái với bạn bè ảo hơn bạn bè ngoài đời. Phần lớn cho rằng trò chuyện trên Internet dễ hơn vì họ thiếu kỹ năng giao tiếp. Cũng đúng là cha mẹ thường không biết con mình làm gì trên điện thoại hoặc máy tính. Crosby nói rằng: “Trong khi trẻ em sử dụng mạng xã hội, chỉ khoảng 40% cha mẹ tham gia.” Vì cha mẹ không biết toàn bộ tình hình nên họ cũng không biết cách xử lý việc con mình có khả năng sử dụng mạng xã hội quá mức và thậm chí có thể không nhận ra vấn đề tồn tại. Vì vậy, mạng xã hội có thể thu hút cuộc sống của thanh thiếu niên ngay lập tức hơn cha mẹ, khiến giao tiếp ảo có vẻ “thật” hơn giao tiếp trực tiếp.", "items": [{"q": "41. What is the main idea of the passage?", "opts": ["A. Parents should use social networks more to understand their children.", "B. Students are using social networks too much.", "C. Social networking brings negative effects to students’ face-to-face communication.", "D. Virtual life is easier than real life."], "a": 2, "why": "Đoạn văn tập trung vào tác động tiêu cực của mạng xã hội đối với giao tiếp trực tiếp.", "vi": "Ý chính của đoạn văn là gì? Mạng xã hội gây ảnh hưởng tiêu cực đến việc giao tiếp trực tiếp của học sinh."}, {"q": "42. What do most teenagers think about chatting on the Internet?", "opts": ["A. Chatting on the Internet is easier than talking with real people.", "B. Chatting on the Internet is more difficult than talking with real people.", "C. Chatting on the Internet is funnier than talking with real people.", "D. Chatting on the Internet is more boring than talking with real people."], "a": 0, "why": "Bài đọc nêu phần lớn thanh thiếu niên nghĩ trò chuyện trên Internet dễ hơn vì họ thiếu kỹ năng giao tiếp.", "vi": "Phần lớn thanh thiếu niên nghĩ gì về việc trò chuyện trên Internet? Họ cho rằng trò chuyện trên Internet dễ hơn nói chuyện với người thật."}, {"q": "43. The percentage of 40% refers to ______.", "opts": ["A. The number of parents who let their children use social media.", "B. The number of parents who do not want their children to use media.", "C. The number of parents who use social media.", "D. The number of parents who do not use social media."], "a": 2, "why": "Câu trích dẫn nói chỉ khoảng 40% cha mẹ cũng tham gia vào mạng xã hội.", "vi": "Tỷ lệ 40% đề cập đến số lượng cha mẹ có sử dụng/tham gia mạng xã hội."}, {"q": "44. Which sentence is NOT TRUE according to the passage?", "opts": ["A. The majority of teenagers find it easier to communicate with virtual friends.", "B. The majority of teenagers lack communication skill.", "C. The majority of parents know how to use social media with their children.", "D. The majority of parents do not know how to deal with their children’s overuse of social media."], "a": 2, "why": "Bài đọc nói cha mẹ thường không biết con làm gì trên thiết bị và không biết cách xử lý việc sử dụng mạng xã hội quá mức. Vì vậy C không đúng.", "vi": "Câu nào KHÔNG ĐÚNG theo đoạn văn? Phần lớn cha mẹ biết cách sử dụng mạng xã hội cùng con cái."}, {"q": "45. Which of the following best explains the word “overuse” in the passage?", "opts": ["A. using something overnight", "B. using something too much", "C. using something without thinking", "D. using something with carelessness"], "a": 1, "why": "“Overuse” có nghĩa là sử dụng quá mức hoặc quá nhiều.", "vi": "Từ “overuse” trong đoạn văn có nghĩa gần nhất là gì? Sử dụng thứ gì đó quá nhiều."}]}, {"id": "readshort", "title": "PART B – Reading: Mike", "type": "short", "passage": "Mike likes to spend most of his free time at home. He is tired after work, and usually relaxes in front of the TV for an hour. Sometimes, instead of watching TV, he reads news on the Internet, and about once a week, he sends an email to his family in Vietnam. Mike is also very musical. He enjoys playing the piano and the drums, but his favorite musical instrument to play is the guitar. He plays the guitar in a band. They usually practice at weekends, at his friend Paul’s house. In the past, they practiced in Paul’s house but his neighbor said that they were so noisy. Now they are practicing it in the garden.", "translation": "Mike thích dành phần lớn thời gian rảnh ở nhà. Anh ấy mệt sau giờ làm và thường thư giãn trước TV trong một giờ. Đôi khi, thay vì xem TV, anh đọc tin tức trên Internet và khoảng một lần mỗi tuần, anh gửi email cho gia đình ở Việt Nam. Mike cũng rất yêu âm nhạc. Anh thích chơi đàn piano và trống, nhưng nhạc cụ yêu thích nhất của anh là đàn guitar. Anh chơi guitar trong một ban nhạc. Họ thường luyện tập vào cuối tuần tại nhà người bạn Paul. Trước đây, họ luyện tập ở nhà Paul nhưng hàng xóm phàn nàn rằng họ quá ồn. Bây giờ họ đang luyện tập trong vườn.", "items": [{"q": "46. Where does Mike like to spend his free time?", "a": "Mike likes to spend most of his free time at home.", "why": "Thông tin nằm ngay câu đầu tiên của bài đọc.", "vi": "Mike thích dành phần lớn thời gian rảnh ở đâu? Mike thích dành phần lớn thời gian rảnh ở nhà."}, {"q": "47. Does Mike like watching TV?", "a": "Yes, he does.", "why": "Anh ấy thường thư giãn trước TV một giờ; do đó câu trả lời là Yes, he does.", "vi": "Mike có thích xem TV không? Có, anh ấy có."}, {"q": "48. How often does he send an email to his family?", "a": "About once a week.", "why": "Bài đọc dùng cụm “about once a week” để chỉ tần suất.", "vi": "Anh ấy gửi email cho gia đình bao lâu một lần? Khoảng một lần mỗi tuần."}, {"q": "49. Where does Mike’s family live?", "a": "In Vietnam.", "why": "Bài đọc nói anh gửi email cho gia đình ở Việt Nam.", "vi": "Gia đình Mike sống ở đâu? Ở Việt Nam."}, {"q": "50. What instruments does Mike play?", "a": "The piano, the drums, and the guitar.", "why": "Đoạn văn nêu ba nhạc cụ: piano, drums và guitar.", "vi": "Mike chơi những nhạc cụ nào? Đàn piano, trống và đàn guitar."}]}, {"id": "writing1", "title": "PART C – Writing: Comparative Adverbs", "type": "writing", "items": [{"q": "51. Nick is a careful writer than Phuc. (carefully)", "a": "Nick writes essays more carefully than Phuc", "prefix": "Nick writes essays ", "yellow": "more carefully than Phuc", "suffix": "", "why": "Cấu trúc so sánh hơn của trạng từ dài: S + V + more + adverb + than + ...", "vi": "Nick viết bài luận cẩn thận hơn Phúc."}, {"q": "52. A snail is slower than a crab. (slowly)", "a": "A snail moves more slowly than a crab", "prefix": "A snail moves ", "yellow": "more slowly than a crab", "suffix": "", "why": "Dùng trạng từ “slowly” để diễn tả cách di chuyển; trạng từ dài tạo so sánh hơn bằng “more + slowly”.", "vi": "Ốc sên di chuyển chậm hơn cua."}, {"q": "53. My father’s explanation about the subject was clearer than my brother’s. (clearly)", "a": "My father explained the subject more clearly than my brother", "prefix": "My father explained the subject ", "yellow": "more clearly than my brother", "suffix": "", "why": "Chuyển danh từ “explanation” thành động từ “explained”; dùng trạng từ so sánh hơn “more clearly”.", "vi": "Bố tôi giải thích chủ đề rõ ràng hơn anh/em trai tôi."}, {"q": "54. My cousin is a better singer than I am. (well)", "a": "My cousin sings better than I", "prefix": "My cousin sings ", "yellow": "better than I", "suffix": "", "why": "“Well” là trạng từ bất quy tắc; dạng so sánh hơn là “better”.", "vi": "Anh/chị/em họ của tôi hát hay hơn tôi."}, {"q": "55. Phong is a faster swimmer than Phuc. (fast)", "a": "Phong swims faster than Phuc", "prefix": "Phong swims ", "yellow": "faster than Phuc", "suffix": "", "why": "Chuyển danh từ “swimmer” thành động từ “swims”; trạng từ ngắn “fast” có dạng so sánh hơn “faster”.", "vi": "Phong bơi nhanh hơn Phúc."}]}, {"id": "writing2", "title": "PART C – Writing: Compound Sentences", "type": "writing", "items": [{"q": "56. We can prepare a big meal for dinner. We can eat out in a French restaurant. (or)", "a": "We can prepare a big meal for dinner or we can eat out in a French restaurant", "prefix": "", "yellow": "We can prepare a big meal for dinner or we can eat out in a French restaurant", "suffix": "", "why": "“Or” là liên từ đẳng lập dùng để nối hai lựa chọn. Hai mệnh đề có thể được nối trực tiếp bằng “or”.", "vi": "Chúng ta có thể chuẩn bị một bữa tối thịnh soạn hoặc đi ăn ở một nhà hàng Pháp."}, {"q": "57. It was raining. We still went to the park. (however)", "a": "It was raining; however, we still went to the park.", "prefix": "", "yellow": "It was raining; however, we still went to the park.", "suffix": "", "why": "“However” là trạng từ liên kết diễn tả sự tương phản; thường dùng dấu chấm phẩy trước và dấu phẩy sau “however”.", "vi": "Trời đang mưa; tuy nhiên, chúng tôi vẫn đi đến công viên."}, {"q": "58. She put on a warm coat before going to work. The weather is cold. (therefore)", "a": "The weather is cold; therefore, she put on a warm coat before going to work.", "prefix": "", "yellow": "The weather is cold; therefore, she put on a warm coat before going to work.", "suffix": "", "why": "“Therefore” diễn tả kết quả; thường dùng dấu chấm phẩy trước và dấu phẩy sau “therefore”.", "vi": "Thời tiết lạnh; vì vậy, cô ấy mặc một chiếc áo khoác ấm trước khi đi làm."}, {"q": "59. He didn't like the movie. He left early. (so)", "a": "He didn't like the movie, so he left early", "prefix": "", "yellow": "He didn't like the movie, so he left early", "suffix": "", "why": "“So” là liên từ đẳng lập chỉ kết quả; nối nguyên nhân với kết quả bằng dấu phẩy trước “so”.", "vi": "Anh ấy không thích bộ phim, vì vậy anh ấy rời đi sớm."}, {"q": "60. She first disagreed to join our journey. She changed her mind later. (however)", "a": "She first disagreed to join our journey; however, she changed her mind later.", "prefix": "", "yellow": "She first disagreed to join our journey; however, she changed her mind later.", "suffix": "", "why": "“However” nối hai ý tương phản; dùng dấu chấm phẩy trước và dấu phẩy sau “however”.", "vi": "Ban đầu cô ấy không đồng ý tham gia chuyến đi của chúng tôi; tuy nhiên, sau đó cô ấy đã đổi ý."}]}];
let cur=0, pos={}, states={};sections.forEach(s=>{pos[s.id]=0;states[s.id]=s.items.map(()=>({done:false,correct:false,value:"",hint:false}))});
function login(){if(document.getElementById('pw').value==='367'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';tabs();render()}else document.getElementById('msg').textContent='Incorrect password.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sec(){return sections[cur]}function idx(){return pos[sec().id]}function st(){return states[sec().id][idx()]}
function tabs(){document.getElementById('tabs').innerHTML=sections.map((s,i)=>`<button class="${i===cur?'active':''}" onclick="switchSec(${i})">${s.title}</button>`).join('')}
function switchSec(i){cur=i;tabs();render()}
function nav(s,i){return `<div class="nav"><button class="secondary" onclick="move(-1)" ${i===0?'disabled':''}>Previous</button><label class="small">Go to:</label><select onchange="go(this.value)">${s.items.map((x,j)=>`<option value="${j}" ${j===i?'selected':''}>Question ${j+1}${states[s.id][j].done?' ✓':''}</option>`).join('')}</select><button class="secondary" onclick="move(1)" ${i===s.items.length-1?'disabled':''}>Next</button><button class="reset" onclick="resetQuestion()">Reset this question</button></div>`}
function feedback(item,v,correctAnswer){return `<div class="feedback"><div class="${v.correct?'good':'badtext'}">${v.correct?'Correct!':'Incorrect. Correct answer: '+esc(correctAnswer)}</div><p><b>Giải thích:</b> ${esc(item.why)}</p><div class="translation"><b>Nghĩa tiếng Việt cả câu:</b> ${esc(item.vi)}</div><div class="small">Answer locked. Reset this question to try again.</div></div>`}
function render(){
 let s=sec(),i=idx(),item=s.items[i],v=st(),done=states[s.id].filter(x=>x.done).length,score=states[s.id].filter(x=>x.done&&x.correct).length,body='';
 if(s.type==='mc'||s.type==='readingmc'||s.type==='readingtf'){
  let opts=s.type==='readingtf'?['True','False']:item.opts;
  let answer=s.type==='readingtf'?(item.a==='T'?0:1):item.a;
  body=`<div class="qtext">${esc(item.q)}</div><div class="opts">${opts.map((o,j)=>`<button class="opt ${v.done?(j===answer?'right':(v.value===j?'bad':'')):''}" ${v.done?'disabled':''} onclick="choose(${j})">${s.id==='pron'?o:esc(o)}</button>`).join('')}</div>${v.done?feedback(item,v,s.type==='readingtf'?(item.a==='T'?'True':'False'):item.opts[answer]):''}`;
 }else if(s.type==='text'||s.type==='short'){
  body=`<div class="qtext">${esc(item.q)}</div><div class="entry"><label>Your answer</label><input id="typed" ${v.done?'disabled':''} value="${esc(v.value)}" placeholder="Type your answer here"></div>${s.type==='text'?`<button class="hint" onclick="hint()">HINT</button> `:''}<button onclick="checkText()" ${v.done?'disabled':''}>CHECK</button><div id="hintbox" class="hintbox" style="display:${v.hint?'block':'none'}">${esc(item.hint||'')}</div>${v.done?feedback(item,v,item.a):''}`;
 }else if(s.type==='writing'){
  body=`<div class="qtext">${esc(item.q)}</div><div class="entry"><label>Complete only the yellow part</label><div class="writingline">${item.prefix?`<span>${esc(item.prefix)}</span>`:''}<textarea id="typed" class="yellow" ${v.done?'disabled':''} placeholder="Type the highlighted part">${esc(v.value)}</textarea>${item.suffix?`<span>${esc(item.suffix)}</span>`:''}</div></div><button class="hint" onclick="hint()">HINT</button> <button onclick="checkText()" ${v.done?'disabled':''}>CHECK</button><div id="hintbox" class="hintbox" style="display:${v.hint?'block':'none'}">${esc(item.why)}</div>${v.done?feedback(item,v,item.yellow):''}`;
 }
 let dual=Boolean(s.passage) && Boolean(s.translation);
 let readingPane=dual?`<section class="reading"><h3>Reading passage</h3><div class="reading-text">${esc(s.passage||'Reading passage is not available in the source file.')}</div><h3>Vietnamese translation</h3><div class="reading-text">${esc(s.translation||'Bản dịch chưa được cung cấp.')}</div></section>`:'';
 let content=dual?`<div class="layout">${readingPane}<div class="questions"><h3>Questions</h3><div class="questionno">QUESTION ${i+1} / ${s.items.length}</div>${body}${nav(s,i)}</div></div>`:`<div class="questionno">QUESTION ${i+1} / ${s.items.length}</div>${body}${nav(s,i)}`;
 document.getElementById('work').innerHTML=`<div class="head"><div><h2>${s.title}</h2><div class="score">Score: ${score} / ${done} answered · ${s.items.length} questions</div></div><button class="reset" onclick="resetSection()">Reset this section</button></div><div class="progress"><span style="width:${done/s.items.length*100}%"></span></div>${content}`;
}
function choose(j){let s=sec(),v=st(),item=s.items[idx()];if(v.done)return;let a=s.type==='readingtf'?(item.a==='T'?0:1):item.a;v.done=true;v.value=j;v.correct=j===a;render()}
function norm(x){return String(x||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'')}
function checkText(){let s=sec(),v=st(),item=s.items[idx()];if(v.done)return;let el=document.getElementById('typed'),val=el.value.trim();if(!val){alert('Please type your answer first.');return}v.value=val;v.done=true;if(s.type==='writing')v.correct=norm(val)===norm(item.yellow);else v.correct=norm(val)===norm(item.a);render()}
function hint(){st().hint=true;render()}
function move(d){pos[sec().id]=Math.max(0,Math.min(sec().items.length-1,idx()+d));render()}
function go(n){pos[sec().id]=Number(n);render()}
function resetQuestion(){if(confirm('Reset this question?')){states[sec().id][idx()]={done:false,correct:false,value:'',hint:false};render()}}
function resetSection(){if(confirm('Reset all questions in this section?')){states[sec().id]=sec().items.map(()=>({done:false,correct:false,value:'',hint:false}));pos[sec().id]=0;render()}}
function resetAll(){if(confirm('Reset all sections and scores?')){sections.forEach(s=>{states[s.id]=s.items.map(()=>({done:false,correct:false,value:'',hint:false}));pos[s.id]=0});cur=0;tabs();render()}}
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','x','a','s','p'].includes(e.key.toLowerCase()))e.preventDefault()});
</script></body></html>
